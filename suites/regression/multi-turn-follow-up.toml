# Two turns against one workspace: the second edits the file the first made.
# A fresh session could still find notes.txt, so this pins continuity of work,
# not of history; `loop-session-memory` covers the latter.
prompts = [
  """
Create a file named notes.txt in the current directory.
Write exactly this content: draft one
""",
  """
Now change notes.txt so its content is exactly: final two
Do not create a new file; edit the one you just made.
""",
]
timeout_secs = 240

[[graders]]
kind = "files"
name = "edited-the-first-turn-file"

[[graders.assertions]]
kind = "contains"
path = "notes.txt"
text = "final two"

[[graders.assertions]]
kind = "matches"
path = "notes.txt"
pattern = "^final two\\s*$"
