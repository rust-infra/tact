[package]
name = "tact_host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Reusable Tact host services for terminal, desktop, and embedded frontends"
repository = "https://github.com/rust-infra/tact"
readme = "README.md"

[dependencies]
tact = { version = "2.0.0", path = "../tact" }
tact_llm = { version = "2.0.0", path = "../tact_llm", default-features = false, features = ["legacy-tact", "account"] }
tact_protocol = { version = "2.0.0", path = "../protocol" }
anyhow = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "process", "sync", "time", "macros", "rt-multi-thread", "signal"] }
uuid = { workspace = true }

[features]
default = []
test-support = ["tact/test-support"]

[dev-dependencies]
async-trait = { workspace = true }
clap = { workspace = true }
rmcp = { workspace = true }
tact = { version = "2.0.0", path = "../tact", features = ["test-support"] }
tempfile = { workspace = true }
wiremock = "0.6"
