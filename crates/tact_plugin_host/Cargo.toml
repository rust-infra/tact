[package]
name = "tact_plugin_host"
version = "1.1.33"
edition = "2024"
license = "MIT"
description = "Shared plugin host lifecycle, stdio transport, and supervision."

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
tact = { path = "../tact" }
tact_protocol = { path = "../tact_protocol" }
tokio = { workspace = true, features = ["io-util", "process", "sync", "time", "macros", "rt"] }
uuid = { workspace = true }

[dev-dependencies]
# `test-util` is what lets a test pause the clock: the host-call bound is the
# 30s `DEFAULT_REQUEST_TIMEOUT`, and proving that a hung service fails the call
# must not cost 30 real seconds.
tokio = { workspace = true, features = ["test-util"] }
