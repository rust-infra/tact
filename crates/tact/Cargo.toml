[package]
name = "tact"
version = "1.1.33"
edition = "2024"
license = "MIT"
description = "Tact Runtime Kernel: capability router, permission boundary, events, minimal storage, cancellation."

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tact_protocol = { path = "../tact_protocol" }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "tracing"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
