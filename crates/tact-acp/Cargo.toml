[package]
name = "tact-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ACP (Agent Client Protocol) frontend for Tact"
repository = "https://github.com/rust-infra/tact"

[[bin]]
name = "tact-acp"
path = "src/main.rs"

[lib]
name = "tact_acp"
path = "src/lib.rs"

[dependencies]
agent-client-protocol = { version = "5.3", default-features = false, features = ["stdio", "unstable_protocol_v2"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tact = { version = "2.0.0", path = "../tact" }
tact_host = { version = "2.0.0", path = "../tact_host" }
tact_protocol = { version = "2.0.0", path = "../protocol" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
agent-client-protocol = { version = "5.3", default-features = false, features = ["stdio", "process", "unstable_protocol_v2"] }
tempfile = { workspace = true }
