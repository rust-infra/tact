[package]
name = "tact-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ACP (Agent Client Protocol) frontend for Tact"
repository = "https://github.com/rust-infra/tact"

[[bin]]
name = "tact-acp"
path = "src/main.rs"

[lib]
name = "tact_acp"
path = "src/lib.rs"

[dependencies]
# `plan_removed` (schema 1.20+, stable — it needed `unstable_plan_operations`
# before that) is the only way a client learns the todo panel is finished
# instead of merely unchanged. T3 maps it to a `PlanUpdated { kind: "removed" }`
# and marks the plan superseded.
agent-client-protocol = { version = "5.6", default-features = false, features = ["stdio", "unstable_protocol_v2", "unstable_session_fork"] }
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
similar = "2"
tact = { version = "2.0.0", path = "../tact" }
tact_agent_api = { version = "2.0.6", path = "../agent_api" }
tact_host = { version = "2.0.0", path = "../tact_host" }
tact_llm = { version = "2.0.0", path = "../tact_llm", default-features = false, features = ["legacy-tact"] }
tact_protocol = { version = "2.0.0", path = "../protocol" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
agent-client-protocol = { version = "5.6", default-features = false, features = ["stdio", "process", "unstable_protocol_v2"] }
tempfile = { workspace = true }
