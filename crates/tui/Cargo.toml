[package]
name = "tui"
version = "0.1.0"
edition = "2024"

[features]
test-support = []

[dependencies]
agent_tui_kit = { path = "../agent_tui_kit" }
tact = { path = "../tact" }
tact_extensions = { path = "../tact_extensions" }
tact_llm = { path = "../tact_llm" }
tact_protocol = { path = "../tact_protocol" }
tact_view = { path = "../tact_view" }
anyhow = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
crossterm = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = { workspace = true }
ratatui-markdown = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
syntect = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
toml = { workspace = true }

[dev-dependencies]
tact_extensions = { path = "../tact_extensions", features = ["test-support"] }
tempfile = { workspace = true }
