[package]
name = "tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[features]
test-support = []

[dependencies]
agent_tui_kit = { version = "0.1.0", path = "../agent_tui_kit" }
tact = { version = "2.0.0", path = "../tact" }
tact_llm = { version = "2.0.0", path = "../tact_llm", default-features = false, features = ["legacy-tact", "model-discovery"] }
tact_protocol = { version = "2.0.0", path = "../protocol" }
anyhow = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
crossterm = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = { workspace = true }
ratatui-markdown = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
syntect = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }

[build-dependencies]
toml = { workspace = true }

[dev-dependencies]
tact = { version = "2.0.0", path = "../tact", features = ["test-support"] }
tempfile = { workspace = true }
