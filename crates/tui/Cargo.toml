[package]
name = "tui"
version = "0.1.0"
edition = "2024"

[features]
# Enabling this compiles the fixture module for external integration tests,
# which build their agents through the runtime's own helpers.
test-support = ["dep:tact", "dep:tact_llm"]

[dependencies]
agent_tui_kit = { path = "../agent_tui_kit" }
tact_protocol = { path = "../protocol" }
tact_kernel = { path = "../tact_kernel" }
async-trait = { workspace = true }
anyhow = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
crossterm = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = { workspace = true }
ratatui-markdown = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
syntect = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }

[build-dependencies]
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Optional, enabled by `test-support`: the fixture module instantiates the
# runtime's real config helpers so a test asserts what production would. The
# production target deliberately has neither, which is what the architecture
# guard checks.
[dependencies.tact]
path = "../tact"
features = ["test-support"]
optional = true

[dependencies.tact_llm]
path = "../tact_llm"
optional = true

# The crate's own unit tests also compile `test_fixtures`, so they need the same
# optional dependencies that `test-support` pulls in. Same versions, no feature
# activation of their own.
[dev-dependencies.tact]
path = "../tact"
features = ["test-support"]

[dev-dependencies.tact_llm]
path = "../tact_llm"
