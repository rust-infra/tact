[package]
name = "tact-session"
description = "Headless agent session runtime shared by Tact front ends"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tact_session"
path = "src/lib.rs"

[dependencies]
tact = { path = "../tact", features = ["test-support"] }
tact_llm = { path = "../tact_llm" }
tact_protocol = { path = "../protocol" }
anyhow = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "process", "sync", "time", "macros", "rt-multi-thread", "signal"] }
uuid = { workspace = true }
