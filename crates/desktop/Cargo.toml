[package]
name = "tact-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native Tact Desktop frontend"

[lib]
name = "tact_desktop"
path = "src/lib.rs"

[[bin]]
name = "tact-desktop"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
env_logger = "0.11"
log = "0.4"
nsh-base = "0.3.0"
nsh-core = "0.3.0"
serde = { workspace = true }
serde_json = { workspace = true }
tact_catalog = { version = "2.0.0", path = "../catalog" }
tact_desktop_core = { version = "2.0.0", path = "../desktop_core" }
tokio = { workspace = true, features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.3.0", default-features = false }

[dev-dependencies]
nsh-engine = "0.3.0"
nsh-testing = "0.3.0"
tact_desktop_core = { version = "2.0.0", path = "../desktop_core", features = ["ui-capture"] }
