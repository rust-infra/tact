[package]
name = "agent_tui_kit"
version = "0.1.0"
edition = "2024"
description = "Reusable agent-TUI component kit: thinking/tool cards, streaming markdown log, popup family, task/plan panels. Feed an AgentUpdate stream in, receive Commands out."
license = "MIT"

[dependencies]
tact_protocol = { path = "../protocol" }
crossterm = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = { workspace = true }
ratatui-markdown = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
