[package]
name = "agent_tui_kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Reusable agent-TUI component kit: thinking/tool cards, streaming markdown log, popup family, task/plan panels. Feed an AgentUpdate stream in, receive Commands out."
license = "MIT"

[dependencies]
tact_protocol = { version = "2.0.0", path = "../protocol" }
tact_catalog = { version = "2.0.0", path = "../catalog" }
chrono = { workspace = true }
crossterm = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = { workspace = true }
ratatui-markdown = { workspace = true }
syntect = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
