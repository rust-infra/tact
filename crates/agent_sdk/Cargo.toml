[package]
name = "tact_agent_sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight SDK facade over the Tact provider-neutral agent kernel"
repository = "https://github.com/rust-infra/tact"
readme = "README.md"
keywords = ["agent", "llm", "sdk", "runtime"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
tact_agent_api = { path = "../agent_api" }
tact_agent_core = { path = "../agent_core" }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
tracing = { workspace = true, optional = true }
uuid = { workspace = true }

[features]
default = ["telemetry"]
telemetry = ["dep:tracing"]

[dev-dependencies]
tact_agent_api = { path = "../agent_api", features = ["test-support"] }
tact_agent_core = { path = "../agent_core", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
