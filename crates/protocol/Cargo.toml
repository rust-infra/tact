[package]
name = "tact_protocol"
version = "2.0.0"
edition = "2024"
rust-version = "1.91"
license.workspace = true
description = "Host/frontend protocol types for Tact"
repository = "https://github.com/rust-infra/tact"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tact_agent_api = { version = "2.0.0", path = "../agent_api" }
tokio = { workspace = true, features = ["macros", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
