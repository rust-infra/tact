[package]
name = "tact_ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tact_ui"
path = "src/lib.rs"

[[bin]]
name = "tact-ui"
path = "src/main.rs"

[dependencies]
tact = { path = "../tact" }
tact_extensions = { path = "../tact_extensions", features = ["test-support"] }
tact_trajectory = { path = "../tact_trajectory" }
tact_llm = { path = "../tact_llm" }
tact_protocol = { path = "../tact_protocol" }
tact_view = { path = "../tact_view" }
tui = { path = "../tui", features = ["test-support"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
console-subscriber = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "process", "sync", "time", "macros", "rt-multi-thread", "signal"] }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
clap = { workspace = true }
rmcp = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "process", "sync", "time", "macros", "rt-multi-thread", "signal"] }
wiremock = "0.6"
