[package]
name = "tact_eval"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Repeatable evaluation harness for the Tact agent"
repository = "https://github.com/rust-infra/tact"

[lib]
name = "tact_eval"
path = "src/lib.rs"

[[bin]]
name = "tact-eval"
path = "src/main.rs"

[dependencies]
tact = { version = "2.0.0", path = "../tact" }
tact_host = { version = "2.0.0", path = "../tact_host" }
tact_protocol = { version = "2.0.0", path = "../protocol" }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "sync", "time", "macros", "rt-multi-thread"] }
toml = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
