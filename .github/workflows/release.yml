name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: tact-ui
  CRATE_PACKAGE: tact-ui
  GUI_BINARY_NAME: tact-gui
  GUI_CRATE_PACKAGE: tact-gui
  # The updater's public key is compiled into the app (`option_env!`), so it has
  # to be set for every binary build, not only for the packaging step — the
  # tarball path ships a binary built earlier in the job. A repository variable,
  # not a secret: it is the public half.
  TACT_UPDATE_PUBKEY: ${{ vars.TACT_UPDATE_PUBKEY }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up macOS cross-compilation env
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          echo "CC_x86_64_apple_darwin=clang -arch x86_64" >> "${GITHUB_ENV}"
          echo "AR_x86_64_apple_darwin=ar" >> "${GITHUB_ENV}"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # The desktop client links the same system libraries a GTK app does:
        # fontconfig and freetype for text, xkbcommon and wayland/x11 for the
        # window, ALSA for audio. The TUI adds sqlite, openssl, and clang for
        # its bindgen-based dependencies.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libssl-dev \
            libsqlite3-dev \
            pkg-config \
            clang \
            libclang-dev

      - name: Build release binaries
        run: cargo build --release -p "${CRATE_PACKAGE}" -p "${GUI_CRATE_PACKAGE}" --target "${{ matrix.target }}"
        shell: bash

      - name: Install cargo-packager
        shell: bash
        run: cargo install cargo-packager --locked

      - name: Build platform installers
        id: installers
        # The manual installers are the new part of this pipeline, and each
        # platform's tooling (linuxdeploy, WiX, NSIS) is downloaded at build
        # time. A platform that cannot produce one still ships the tarball the
        # installer script has always used, so this step degrades instead of
        # failing the release; the warning below makes the gap visible.
        continue-on-error: true
        shell: bash
        # Signing is opt-in: the packager reads CARGO_PACKAGER_SIGN_PRIVATE_KEY
        # from the environment, and the release job only publishes an update
        # manifest when the artifacts carry signatures.
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux) formats="deb,appimage" ;;
            macOS) formats="dmg,app" ;;
            Windows) formats="nsis,wix" ;;
            *) echo "unsupported runner ${RUNNER_OS}" >&2; exit 1 ;;
          esac
          bash ./scripts/package.sh "${formats}"

      - name: Warn when a platform produced no installers
        if: steps.installers.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::cargo-packager failed for ${{ matrix.target }}; \
            this release ships the tarball only"

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '
            /^\[workspace\.package\]/ { in_pkg=1; next }
            /^\[/ { in_pkg=0 }
            in_pkg && /^version = "/ {
              gsub(/"/, "", $3); print $3; exit
            }
          ' Cargo.toml)"
          mkdir -p installers
          # Signature files are only written when a key was supplied.
          if [[ -d dist/desktop ]]; then
            find dist/desktop -maxdepth 1 -type f \( \
              -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \
              -o -name '*.app.tar.gz' -o -name '*.exe' -o -name '*.msi' \
              -o -name '*.sig' \) -exec cp {} installers/ \;
          fi
          # One description per platform, folded into latest.json later. A
          # build with no signature writes nothing here, and the release ships
          # without an update manifest rather than with one the app must reject.
          python3 .github/scripts/collect_installers.py \
            --dir installers \
            --target "${{ matrix.target }}" \
            --version "${version}" \
            --out "installers/platform-${{ matrix.target }}.json"
          ls -l installers

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: installers/*
          if-no-files-found: warn

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk '
              /^\[workspace\.package\]/ { in_pkg=1; next }
              /^\[/ { in_pkg=0 }
              in_pkg && /^version = "/ {
                gsub(/"/, "", $3); print $3; exit
              }
            ' Cargo.toml)"
          fi

          target="${{ matrix.target }}"
          archive="${{ matrix.archive }}"
          asset="${BINARY_NAME}-v${version}-${target}.${archive}"
          release_dir="target/${target}/release"
          # The archive holds a directory rather than loose files, because the
          # desktop client ships beside the TUI: `scripts/install.sh` looks for
          # `${BINARY_NAME}-<triple>/` and installs both binaries from it.
          staging="${BINARY_NAME}-${target}"
          rm -rf "${staging}"
          mkdir -p "${staging}"

          if [[ "${archive}" == "zip" ]]; then
            cp "${release_dir}/${BINARY_NAME}.exe" "${staging}/${BINARY_NAME}.exe"
            cp "${release_dir}/${GUI_BINARY_NAME}.exe" "${staging}/${GUI_BINARY_NAME}.exe"
            7z a -tzip "${asset}" "${staging}"
          else
            cp "${release_dir}/${BINARY_NAME}" "${staging}/${BINARY_NAME}"
            cp "${release_dir}/${GUI_BINARY_NAME}" "${staging}/${GUI_BINARY_NAME}"
            if command -v strip >/dev/null 2>&1; then
              strip "${staging}/${BINARY_NAME}" || true
              strip "${staging}/${GUI_BINARY_NAME}" || true
            fi
            if [[ "${RUNNER_OS}" == "Linux" ]]; then
              cp packaging/tact-gui.desktop "${staging}/tact-gui.desktop"
              cp tact.png "${staging}/tact.png"
            fi
            tar -czf "${asset}" "${staging}"
          fi

          echo "ASSET_PATH=${asset}" >> "${GITHUB_ENV}"
          echo "Built ${asset}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum ${BINARY_NAME}-v* > SHA256SUMS
          cat SHA256SUMS

      - name: Assemble the update manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          # `latest.json` is what the in-app updater reads. It is published only
          # when the release is signed: an unsigned manifest would let the app
          # announce an update it must then refuse to install.
          python3 .github/scripts/make_update_manifest.py \
            --dist dist \
            --version "${GITHUB_REF_NAME#v}" \
            --out dist/latest.json \
            --repo "${GITHUB_REPOSITORY}"
          echo "entries=$(python3 -c "import json;print(len(json.load(open('dist/latest.json'))['platforms']))")" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Note a missing manifest
        if: steps.manifest.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::no signed installers, so no latest.json was published; \
            the desktop client will report that it cannot verify an update"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # A tag like v1.1.31-rc.1 is a pre-release, and must not become
          # GitHub's "latest" release: the updater's default endpoint points at
          # /releases/latest/download, which has to keep serving a stable build.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
