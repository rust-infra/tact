name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: tact-ui
  CRATE_PACKAGE: tact-ui
  GUI_BINARY_NAME: tact-gui
  GUI_CRATE_PACKAGE: tact-gui

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up macOS cross-compilation env
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          echo "CC_x86_64_apple_darwin=clang -arch x86_64" >> "${GITHUB_ENV}"
          echo "AR_x86_64_apple_darwin=ar" >> "${GITHUB_ENV}"

      - name: Install Linux audio development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Build release binaries
        run: cargo build --release -p "${CRATE_PACKAGE}" -p "${GUI_CRATE_PACKAGE}" --target "${{ matrix.target }}"
        shell: bash

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk '
              /^\[workspace\.package\]/ { in_pkg=1; next }
              /^\[/ { in_pkg=0 }
              in_pkg && /^version = "/ {
                gsub(/"/, "", $3); print $3; exit
              }
            ' Cargo.toml)"
          fi

          target="${{ matrix.target }}"
          archive="${{ matrix.archive }}"
          asset="${BINARY_NAME}-v${version}-${target}.${archive}"
          release_dir="target/${target}/release"
          # The archive holds a directory rather than loose files, because the
          # desktop client ships beside the TUI: `scripts/install.sh` looks for
          # `${BINARY_NAME}-<triple>/` and installs both binaries from it.
          staging="${BINARY_NAME}-${target}"
          rm -rf "${staging}"
          mkdir -p "${staging}"

          if [[ "${archive}" == "zip" ]]; then
            cp "${release_dir}/${BINARY_NAME}.exe" "${staging}/${BINARY_NAME}.exe"
            cp "${release_dir}/${GUI_BINARY_NAME}.exe" "${staging}/${GUI_BINARY_NAME}.exe"
            7z a -tzip "${asset}" "${staging}"
          else
            cp "${release_dir}/${BINARY_NAME}" "${staging}/${BINARY_NAME}"
            cp "${release_dir}/${GUI_BINARY_NAME}" "${staging}/${GUI_BINARY_NAME}"
            if command -v strip >/dev/null 2>&1; then
              strip "${staging}/${BINARY_NAME}" || true
              strip "${staging}/${GUI_BINARY_NAME}" || true
            fi
            if [[ "${RUNNER_OS}" == "Linux" ]]; then
              cp packaging/tact-gui.desktop "${staging}/tact-gui.desktop"
              cp tact.png "${staging}/tact.png"
            fi
            tar -czf "${asset}" "${staging}"
          fi

          echo "ASSET_PATH=${asset}" >> "${GITHUB_ENV}"
          echo "Built ${asset}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum ${BINARY_NAME}-v* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
