name: Desktop package

# Builds and packages the desktop for every release target without signing or
# publishing. The release workflow owns the signed/notarized macOS path; this
# workflow exists so a feature branch can prove that Linux, Windows, and macOS
# all produce the expected assets before a tag is cut.
#
#   gh workflow run desktop-package.yml --ref <branch>

on:
  workflow_dispatch:
  # Dispatch requires the workflow on the default branch; while the desktop
  # work lives on its feature branch, a push to that branch is the trigger.
  push:
    branches: [ "feat/desktop" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package-desktop:
    name: package desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            nsh_target: linux
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            nsh_target: linux
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            nsh_target: macos
            archive: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            nsh_target: macos
            archive: zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            nsh_target: windows
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up macOS cross-compilation env
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          echo "CC_x86_64_apple_darwin=clang -arch x86_64" >> "${GITHUB_ENV}"
          echo "AR_x86_64_apple_darwin=ar" >> "${GITHUB_ENV}"

      - name: Install Linux desktop development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libgtk-4-dev \
            libsqlite3-dev libxkbcommon-dev pkg-config xvfb

      - name: Install Native Shell
        run: cargo install nsh-cli --version 0.3.0 --locked
        shell: bash

      - name: Build the desktop CLI
        run: cargo build --release -p tact-ui --target "${{ matrix.target }}"
        shell: bash

      - name: Collect third-party license texts
        shell: bash
        run: |
          python3 scripts/collect-licenses.py \
            --target "${{ matrix.target }}" \
            --output THIRD-PARTY-LICENSES.txt

      - name: Package desktop asset
        shell: bash
        env:
          NSH_TARGET: ${{ matrix.nsh_target }}
          ARCHIVE: ${{ matrix.archive }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-$(git log -1 --format=%ct)}"
          version="$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("Cargo.toml").read_text(encoding="utf-8")
          section = re.search(r'^\[workspace\.package\]\s*$(.*?)(?=^\[|\Z)', text, re.M | re.S).group(1)
          print(re.search(r'^version\s*=\s*"([^"]+)"', section, re.M).group(1))
          PY
          )"
          asset="tact-desktop-v${version}-${TARGET}.${ARCHIVE}"
          CLI_BIN="target/${TARGET}/release/tact-ui" \
            scripts/package-desktop.sh "${NSH_TARGET}" "${version}" "${asset}"
          echo "ASSET_PATH=${asset}" >> "${GITHUB_ENV}"

      - name: Verify packaged desktop archive from clean app data
        shell: bash
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/tact-package-$RANDOM"
          clean_app="$RUNNER_TEMP/tact-clean-$RANDOM"
          mkdir -p "$verify/extracted" "$clean_app"
          cp "$ASSET_PATH" "$verify/"
          cd "$verify"

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ditto -x -k "$ASSET_PATH" extracted
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            7z x "$ASSET_PATH" -oextracted >/dev/null
          else
            tar -xzf "$ASSET_PATH" -C extracted
          fi

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin="$verify/extracted/tact-desktop.exe"
            test -f "$bin"
            test -f "$verify/extracted/tact-ui.exe"
            test -d "$verify/extracted/nsh"
            test -f "$verify/extracted/THIRD-PARTY-LICENSES.txt"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            plutil -lint "$verify/extracted/Tact Desktop.app/Contents/Info.plist"
            bin="$verify/extracted/Tact Desktop.app/Contents/MacOS/tact-desktop"
            test -x "$bin"
            test -f "$verify/extracted/Tact Desktop.app/Contents/MacOS/tact-ui"
            test -d "$verify/extracted/Tact Desktop.app/Contents/Resources/nsh"
            test -f "$verify/extracted/Tact Desktop.app/Contents/Resources/THIRD-PARTY-LICENSES.txt"
            test -f "$verify/extracted/Tact Desktop.app/Contents/Resources/AppIcon.icns"
          else
            bin="$verify/extracted/tact-desktop"
            test -x "$bin"
            test -f "$verify/extracted/tact-ui"
            test -d "$verify/extracted/nsh"
            test -f "$verify/extracted/THIRD-PARTY-LICENSES.txt"
          fi

          HOME="$clean_app" XDG_DATA_HOME="$clean_app/data" \
            "$GITHUB_WORKSPACE/scripts/smoke-desktop.sh" "$bin"
