name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A second push to the same PR cancels the first run. The desktop jobs take 15
# to 22 minutes, so without this a review round queued three of them at once and
# the newest result waited behind superseded ones. `main` is never cancelled:
# a merge to it always finishes, because that is the run a rollback reads.
concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The dev profile enables incremental compilation for local edit-build loops.
  # CI never reuses an edited tree, so the cache would only bloat `target/`
  # (which these workflows restore and save) and slow the first build down.
  CARGO_INCREMENTAL: 0

jobs:
  # Decides whether the desktop job has anything to check.
  #
  # A separate job rather than a workflow-level `paths:` filter, because that
  # filter skips *every* job: a PR touching only `crates/eval` would have run no
  # CI at all. It runs on every event, `main` included, so it is never skipped:
  # a job that `needs` a skipped job is itself skipped.
  paths:
    name: Desktop paths
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did any desktop dependency change?
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A merge to `main` always runs the desktop job: it is what ships, and
          # a merge that skipped these tests is the commit a rollback reads.
          if [ "$EVENT" != "pull_request" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: the desktop job runs"
            exit 0
          fi

          # The workspace half of `cargo tree -p tact-desktop`. Every crate here
          # is one `tact_desktop_core` or `tact-desktop` compiles, so a change
          # to any of them can break the desktop build even though no desktop
          # file moved. Adding a dependency to a desktop crate means adding its
          # path here.
          paths=(
            crates/desktop crates/desktop_core crates/catalog
            crates/tact crates/tact_host crates/tact_llm crates/protocol
            crates/agent_api crates/agent_core crates/tool_refactor_macros
            Cargo.toml Cargo.lock rust-toolchain.toml .cargo/config.toml
            scripts/check-desktop-deps.sh scripts/check-rust.sh
            .github/workflows/rust.yml
          )
          # `git diff` rather than a third-party paths-filter action: this
          # workflow otherwise uses only `actions/*` and `dtolnay/*`, and the
          # job that decides whether the desktop tests run is a poor place to
          # start trusting a new action.
          #
          # Three dots, not two. `pull_request.base.sha` is the tip of the base
          # branch, not the merge base, so a two-dot diff would report *main's*
          # own commits as this PR's changes once main moved ahead — turning the
          # filter into "always true" for any long-lived branch and quietly
          # undoing the saving. `A...B` is the diff from `merge-base(A, B)` to
          # B, which is exactly "what this PR changed".
          # `--no-renames` because rename detection prints only the destination
          # path: a desktop file moved out of `crates/desktop*` would otherwise
          # look like an unrelated addition and skip the job that would notice
          # the removal.
          changed="$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")"
          hit=false
          for path in "${paths[@]}"; do
            if printf '%s\n' "$changed" | grep -qE "^${path//./\\.}(/|$)"; then
              echo "desktop dependency changed: $path"
              hit=true
            fi
          done
          echo "desktop=$hit" >> "$GITHUB_OUTPUT"

  kernel-deps:
    name: Kernel dependency boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `check-package.sh` builds `fixtures/tact-host-consumer`, whose closure
      # reaches `tact` and therefore `cpal`/`alsa-sys`: the runner image does
      # not carry the ALSA headers, so the job needs the same system libraries
      # the build jobs install.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libasound2-dev pkg-config clang libclang-dev
      - run: scripts/check-agent-kernel-deps.sh tact_agent_api tact_agent_core tact_llm tact_agent_sdk
      - run: python3 scripts/check-packaging.py
      - run: scripts/check-package.sh

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check -p tact_agent_sdk --no-default-features
      - run: cargo check -p tact_llm --no-default-features --features openai-chat
      - run: cargo check -p tact_llm --no-default-features --features openai-responses

  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libsqlite3-dev \
            libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev pkg-config clang libclang-dev
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      # `--workspace`: root Cargo.toml sets `default-members` to the
      # shippable binaries, so a bare clippy would skip desktop/agent crates.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    name: Doc check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libsqlite3-dev \
            libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev pkg-config clang libclang-dev
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-clippy-
      # `--no-deps` documents this workspace only: rustdoc is run for the seven
      # path crates, never for the ~330 third-party ones (they are still built,
      # since rustdoc resolves intra-doc links through `--extern`). Warnings are
      # not denied — the workspace carries pre-existing `broken_intra_doc_links`
      # ones — so the job fails only when the docs stop building.
      - name: Build the workspace docs
        run: cargo doc --workspace --no-deps

  book:
    name: Book check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/book-check.py book

  # No model and no API key: this catches a malformed case, a moved fixture, or
  # an invalid grader regex before the paid suite can run. It is its own job,
  # built with `--no-default-features`, so it does not wait for — or pay for —
  # the agent stack that `run` needs.
  eval-validate:
    name: Eval suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-eval-validate-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-eval-validate-
      - name: Validate eval suites (no model)
        run: |
          cargo run -q -p tact_eval --no-default-features -- validate suites/smoke
          cargo run -q -p tact_eval --no-default-features -- validate suites/regression

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libsqlite3-dev \
            libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev pkg-config clang libclang-dev
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - name: Run full workspace tests
        # `--workspace`: `default-members` otherwise narrows this to tact-ui.
        run: cargo test --workspace --verbose

  desktop:
    name: Desktop (${{ matrix.os }})
    # Skipped on pull requests that touch nothing a desktop target compiles.
    # `main` is asked and told "yes" by the `paths` job, so a merge always runs
    # these tests.
    #
    # The list the `paths` job checks is the workspace half of
    # `cargo tree -p tact-desktop`: `tact_desktop_core` depends on `tact`,
    # `tact_host`, `tact_llm`, `tact_protocol`, `tact_agent_api`, and
    # `tact_agent_core`, so a change to any of those can break the desktop build
    # even though no desktop file moved.
    #
    # `ci:full` forces the job on a PR that looks unrelated to it.
    if: >-
      needs.paths.outputs.desktop == 'true' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'ci:full'))
    needs: paths
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libsqlite3-dev \
            libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev pkg-config
      - name: Check desktop crates
        run: cargo check -p tact_catalog -p tact_desktop_core -p tact-desktop
      # The ACP transport is behind a feature, so neither the default check nor
      # the default test run compiles it. Without this step a broken
      # `acp_bridge`/`acp_host` mapping reaches a release build unnoticed, since
      # the packaging workflow only builds it at tag time.
      - name: Check the ACP transport
        run: cargo clippy -p tact_desktop_core -p tact-desktop --features acp-host --all-targets -- -D warnings
      - name: Check desktop dependency boundaries
        shell: bash
        run: scripts/check-desktop-deps.sh
      - name: Run desktop core tests
        run: cargo test -p tact_desktop_core --lib
      - name: Run desktop core ACP tests
        run: cargo test -p tact_desktop_core --features acp-host --lib
      - name: Run desktop ACP end-to-end tests
        run: cargo test -p tact_desktop_core --features acp-host --test acp_host --test acp_turn
      - name: Run desktop smoke tests
        run: cargo test -p tact-desktop --lib
      - name: Run desktop parity tests
        run: cargo test -p tact-desktop --test parity
