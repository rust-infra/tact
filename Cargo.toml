[workspace]
members = [
    "crates/protocol",
    "crates/tui",
    "crates/tact",
    "crates/tact-ui",
    "crates/tact_llm",
    "crates/tool_refactor_macros",
]
resolver = "2"

[workspace.package]
version = "1.1.14"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
arboard = "3"
async-openai = "0.20"
async-openai-responses = { package = "async-openai-local", path = "vendor/async-openai", version = "0.41.3", features = ["responses", "byot"] }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
console-subscriber = "0.5"
crossterm = { version = "0.28", features = ["event-stream"] }
dashmap = "6"
derive_builder = "0.20"
dotenvy = "0.15"
eventsource-stream = "0.2"
futures-util = "0.3"
flate2 = "1"
globset = "0.4"
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
libc = "0.2"
proc-macro2 = "1.0"
pulldown-cmark = "0.13"
quote = "1.0"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "rustls"] }
reqwest-eventsource = "0.6"
rmcp = { version = "0.17.0", default-features = false, features = ["client", "transport-child-process"] }
schemars = "1.0"
secrecy = "0.8"
secrecy10 = { package = "secrecy", version = "0.10.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
syn = { version = "2.0", features = ["full"] }
tar = "0.4"
tempfile = "3"
tera = "1"
tokio = { version = "1" }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
cpal = "0.15"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
tui-markdown = "0.3.7"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
ratatui-markdown = { git = "https://github.com/celestia-island/ratatui-markdown", branch = "chore/update-ratatui-0.30", default-features = false, features = ["markdown", "mermaid"] }
