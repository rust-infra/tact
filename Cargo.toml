[workspace]
members = [
    "crates/protocol",
    "crates/agent_tui_kit",
    "crates/tui",
    "crates/agent_api",
    "crates/agent_core",
    "crates/agent_sdk",
    "crates/tact",
    "crates/tact_host",
    "crates/tact-ui",
    "crates/tact_llm",
    "crates/catalog",
    "crates/desktop_core",
    "crates/desktop",
    "crates/tool_refactor_macros",
]
resolver = "2"

# A bare `cargo build` / `cargo run` / `cargo clippy` covers only the terminal
# entry point. Without this, a default build also compiles every test and
# example unit of all 14 members: touching one source file in `tact` cost 18.8s
# instead of 11.7s.
#
# `tact-ui` is the main binary and the one `cargo run` should mean. Desktop is
# deliberately absent: it depends on `tact_desktop_core`, so listing it here
# adds ~1.3s to every rebuild triggered by a `tact` edit and pulls gpui into a
# loop that is usually reading TUI code. Build it with
# `cargo build -p tact-desktop` (or `scripts/check-ui.sh`).
#
# Every gate that must stay workspace-wide passes `--workspace` explicitly:
# `scripts/check-rust.sh`, `.github/workflows/rust.yml`. This matters — a bare
# `cargo clippy --all-targets` silently stops checking `desktop`,
# `desktop_core`, and the `agent_*` crates once this list is set.
default-members = ["crates/tact-ui"]

[workspace.package]
version = "2.0.4"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1.0"
arboard = { version = "3", features = ["wayland-data-control"] }
async-openai = "0.20"
bytes = "1"
async-openai-responses = { package = "async-openai", version = "0.42.2", features = ["responses", "byot"] }
# 0.1.92 stopped emitting `#[must_use]` on the boxed futures it generates;
# earlier versions trip clippy 1.99's `double_must_use` under `-D warnings`.
async-trait = "0.1.92"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
console-subscriber = "0.5"
crossterm = { version = "0.28", features = ["event-stream"] }
derive_builder = "0.20"
dotenvy = "0.15"
eventsource-stream = "0.2"
futures-util = "0.3"
httpdate = "1"
flate2 = "1"
globset = "0.4"
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
libc = "0.2"
proc-macro2 = "1.0"
pulldown-cmark = "0.13"
quote = "1.0"
ratatui = "0.30"
regex = "1"
syntect = "5.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
reqwest-eventsource = "0.6"
rmcp = { version = "0.17.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
    "auth",
] }
schemars = "1.0"
secrecy = "0.8"
secrecy10 = { package = "secrecy", version = "0.10.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
syn = { version = "2.0", features = ["full"] }
tar = "0.4"
tempfile = "3"
tera = "1"
tokio = { version = "1" }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
cpal = "0.15"
toml = "0.8"
toml_edit = "0.22"
# `attributes` (the proc macro) is opt-in per crate so libraries that only
# emit spans do not drag `syn` into every consumer's build.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# tact-ui installs its own file fmt layer; no default features (no ansi /
# tracing-log) so the `log` bridge cannot leak MCP logs into the TUI.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
ratatui-markdown = { git = "https://github.com/celestia-island/ratatui-markdown", rev = "3a8bcbe", default-features = false, features = ["mermaid"] }
gpui = { package = "gpui-pre", version = "=0.3.3" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.3" }
gpui_component = { package = "gpui-component", version = "=0.6.0" }
gpui_base = { package = "gpui-base", version = "=0.6.0" }
gpui_component_assets = { package = "gpui-kit-assets", version = "=0.6.0" }
gpui-component-macros = "=0.6.0"
im = "15"

# Keep the dev build fast to compile and small on disk. This workspace has ~30
# bin/test units per crate and Cargo stores every unit's artifacts in its own
# hash directory, so a rebuilt unit hash keeps a full copy of its outputs: a
# fully-debug tact-ui binary is 576 MB (76% of it DWARF). Debug info stays off
# and only dependencies pay for optimization: workspace units rebuild
# constantly, while gpui and tokio need the speed at runtime. Line tables would
# keep backtraces useful, but they cost disk.
#
# `incremental` is ON for workspace crates and OFF for dependencies.
#
# It used to be off everywhere to save disk. Measured on this 14-core machine,
# that traded away most of the edit-build loop for very little space:
#   edit one file in `tact`       11.8s -> 2.8s
#   touch every workspace source  20.0s -> 6.9s
# The workspace side of the cache is ~2.7 GB after a full `cargo test`; a cold
# build pays ~4s for it.
#
# Dependencies stay non-incremental because they are rebuilt rarely: the cache
# their units would add is pure cost, and dropping it keeps a crate that a
# workspace crate merely depends on out of `target/debug/incremental/`.
[profile.dev]
#debug = "line-tables-only"
debug = false
opt-level = 0
incremental = true

# Dependencies are rebuilt far less often than workspace crates, so their
# one-time optimization is cheap and the runtime difference in gpui is not.
[profile.dev.package."*"]
opt-level = 1
incremental = false

# The desktop preview's scroll path is measured in book/26: unoptimized layout
# and text shaping took chat CPU from 13.6% to 42-50% under rapid scrolling.
# Keep those two crates optimized even though the rest of the workspace is not.
[profile.dev.package.tact-desktop]
opt-level = 1

[profile.dev.package.tact_desktop_core]
opt-level = 1
