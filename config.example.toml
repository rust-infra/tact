# tact configuration (TOML)
#
# On first run, when no config file exists anywhere, tact-ui writes a copy
# of this template to ~/.tact/config.toml automatically (edit it to add your
# API key). You can also copy it manually to one of these locations
# (auto-discovered, first match wins):
#   ./.tact/config.toml      project-level
#   ./config.toml            project-level (alternative)
#   ~/.tact/config.toml      user-global
#
# Or pass an explicit path:
#   tact-ui --config /path/to/config.toml
#
# Interactive TUI (default):
#   tact-ui
#
# Headless single-shot task:
#   tact-ui headless "fix all clippy warnings"
#   tact-ui headless "refactor error handling in lib.rs"
#
# Priority: CLI flags override values in this file.

# ---------------------------------------------------------------------------
# LLM (required for tact-ui unless overridden via CLI)
# ---------------------------------------------------------------------------
# Active provider selects which [llm.providers.*] entry is used.
# Credentials live under providers — not as flat fields on [llm].
# Switch with llm.provider or --provider.
# Built-in identities: anthropic | openai | deepseek | kimi. Any other name
# is accepted as a custom OpenAI-compatible provider (OpenAI Chat Completions
# / Responses protocol) and requires an explicit base_url in its entry.
[llm]
provider = "deepseek"

# Optional globals (overridable per provider entry, then by CLI flags).
# `max_tokens` is NOT settable here — use [agent].max_tokens (or the per-provider
# entry); a leftover key is a hard startup error naming the replacement.
# thinking_budget = 0  # off by default; set to e.g. 8000 to enable

# Optional per-model thinking parameter options (model id → selectable tiers).
# The /model second step shows only these tiers for the picked model; models
# without an entry fall back to provider defaults (openai: minimal..max;
# deepseek / kimi k3: low/high/max; anthropic / kimi coding: 5 budget tiers).
# `reasoning_efforts` applies to effort-semantic models (openai / deepseek /
# kimi k3/k3-256k); `thinking_budgets` to budget-semantic models (anthropic /
# kimi-for-coding*). Cross-dimension entries are ignored, not errors.
#
# An effort tier is a *name*, not a token allowance — and on a provider that
# bills reasoning inside the output budget it is not a bound on thinking
# either. DeepSeek (api-docs.deepseek.com/guides/thinking_mode) accepts `none`
# (thinking off) / `low` / `high` / `max` (default `high`; `minimal`→`low`,
# `medium`/`xhigh`→`high`), counts reasoning inside `max_tokens`, and defaults
# an unset `max_tokens` to 8K with thinking off vs 64K with it on (128K at
# `max`). The API reference lists `deepseek-flash` and `deepseek-v4-pro` as the
# current ids, and both use that same tier table (`low`/`high`/`max` are the
# selectable ones). There `[agent] max_tokens` is the only number that bounds
# thinking, so the compaction summarizer floors its envelope by it (book Ch 5 §5).
#
# `supports_vision` overrides the image-input gate for that exact model id
# (None/unset = endpoint heuristic: a DeepSeek-ish id counts as text-only
# unless it contains "vision"). Set it when the heuristic is wrong for your
# endpoint — typically an OpenAI-compatible proxy whose entry serves a mixed
# pool, e.g. one proxy hosting an image-capable `deepseek-flash` next to a
# text-only `deepseek-v4-flash`. `true` lets image parts through to the API
# (a text-only target then answers 400), `false` refuses them locally.
# [llm.model_profiles."gpt-5.6"]
# reasoning_efforts = ["low", "medium", "high"]
# [llm.model_profiles."deepseek-v4-flash"]
# reasoning_efforts = ["low", "high", "max"]
# supports_vision = false
# [llm.model_profiles."claude-sonnet-4-20250514"]
# thinking_budgets = [0, 8000, 32000]
# [llm.model_profiles."deepseek-flash"]
# supports_vision = true

[llm.providers.anthropic]
# Not active by default — switch [llm] provider to "anthropic" to use it.
api_key = "sk-ant-..."
model = "claude-sonnet-4-20250514"
# Anthropic has no default base_url — required
base_url = "https://api.anthropic.com"

[llm.providers.openai]
api_key = "sk-..."
model = "gpt-4o"
protocol = "responses"
# reasoning_effort = "high" # none|minimal|low|medium|high|xhigh|max
# base_url defaults to https://api.openai.com/v1
# Omit protocol or set "chat_completions" for OpenAI-compatible proxies.
# Omit reasoning_effort to keep the thinking_budget low/medium/high mapping.

# Optional OpenAI Responses `context_management.compact_threshold` (tokens).
# Sent on every ordinary `/responses` request so the endpoint compacts the
# protocol baseline automatically at the threshold. When omitted, the
# threshold is derived from agent.model_context_window / the resolved
# max_tokens with 10% headroom (only for protocol = "responses").
# responses_compact_threshold = 160000
# Endpoints lacking native Responses compaction are unsupported; Tact never
# falls back to local summary compaction for protocol = "responses".

[llm.providers.deepseek]
# Active by default in this example (see [llm] provider above).
api_key = "sk-..."
model = "deepseek-chat"
protocol = "chat_completions"
# base_url defaults to https://api.deepseek.com
# protocol = "chat_completions" is the OpenAI-compatible Chat Completions API
# (default). This example does not use protocol = "responses".

[llm.providers.kimi]
api_key = "sk-..."
model = "kimi-k2.5"
models = ["kimi-k2.5", "kimi-for-coding"]
# base_url defaults to https://api.moonshot.cn/v1
# max_tokens = 32000           # optional per-provider override
# thinking_budget = 64000

# Heuristics still allow provider = "openai" + a Moonshot/Kimi-compatible
# base_url; prefer a dedicated [llm.providers.kimi] entry.

# ---------------------------------------------------------------------------
# Permission
# ---------------------------------------------------------------------------
[permission]
# Controls the permission mode only: "default" | "plan" | "auto"
#
# Dynamic allow/ask/deny rules are NOT stored in this file.
# They live in JSON settings files at:
#   $HOME/.tact/settings.json       (global scope)
#   <workdir>/.tact/settings.json   (project scope)
#
# JSON shape (example):
#   {
#     "permissions": {
#       "allow": [
#         "bash(command:cargo test *)",
#         "edit_file(path:src/**)"
#       ],
#       "ask": [
#         "bash(command:git push *)"
#       ],
#       "deny": [
#         "bash(command:rm -rf *)"
#       ]
#     }
#   }
#
# Rules: bare tool names (e.g. "read_file") match any input;
# argument rules (e.g. "bash(command:…)") match a specific JSON
# field using glob patterns. Precedence: deny > ask > allow.
#
# Selecting "Always allow this tool" writes a parameter-aware
# rule to the project settings file — not to config.toml.
mode = "default"

# ---------------------------------------------------------------------------
# Agent runtime
# ---------------------------------------------------------------------------
[agent]
# Keys that are not real [agent] fields are a startup error, not a silent
# no-op: `thinking_budget` / `reasoning_effort` live in [llm] (or a provider
# entry), and `model` lives in the provider entry.
#
# Max output tokens for the main agent.
#
# Resolution priority (highest first): --max-tokens > [llm.providers.<active>]
# entry > this key > default 8000 (32000 for Kimi K2.x). Set this when you
# switch providers often and want one number to apply to all of them; set it
# per provider when the providers need different caps.
# (There is no [llm] global for this: it used to sit below this key, where it
# could only apply to users who set nothing here. A leftover [llm] max_tokens
# is now a hard startup error, not a silent drop.)
# Subagents without their own [agent.subagent].max_tokens inherit this value.
# max_tokens = 64000

# Model context window in tokens (must exceed max_tokens when nonzero;
# auto-compaction + TUI usage meter; default: 200000).
#
# Resolution priority (highest first): --model-context-window >
# this key > built-in model→window mapping > default 200000. Known mappings
# (per official model docs, 2026-08):
#   gpt-5.6 / gpt-5.6-luna / gpt-5.6-terra / gpt-5.6-sol / gpt-5.5 -> 1050000
#   gpt-5.4 -> 1000000
#   gpt-5 / gpt-5.1 / gpt-5.2 / gpt-5.3 / gpt-5.3-codex / gpt-5.4-mini -> 400000
#   gpt-4o / gpt-4o-mini -> 128000
#   claude-sonnet-5 / claude-fable-5 / claude-opus-5 / claude-opus-4-8 /
#   claude-opus-4-7 / claude-opus-4-6 / claude-sonnet-4-6 -> 1000000 (API + Claude Code)
#   claude-opus-4-20250514 / claude-sonnet-4-20250514 / claude-haiku-4-5 /
#   claude-haiku-4-20250514 -> 200000
#   deepseek-v4-* / deepseek-v4.* (any suffix or dot-separated minor version,
#   e.g. deepseek-v4-pro, deepseek-v4-flash, deepseek-v4.1-flash,
#   deepseek-v4-flash-version-exp, deepseek-v4-flash-vision-exp), the
#   gateway alias deepseek-flash, and deepseek-reasoner -> 1000000
#   k3-256k -> 256000
# The mapping is only a fallback: setting this key always wins, so a stale
# value for a long-context model can under-report its real window and trigger
# premature auto-compaction. Comment the key out to use the mapping instead
# (an explicit 0 means "unknown window": it disables the window, not falls back).
# model_context_window = 200000

# Max entries in the system-prompt project structure snapshot (default: 80)
# snapshot_max_items = 80

# Truncate old tool results in context (default: true)
# micro_compact_enabled = true

# How many request bodies `token_usages` keeps per session (default: 1).
#
# The column stores the whole serialized request — system prompt, tool schemas
# and, on /responses, the entire context re-sent every call — so keeping them all
# grew a session database to 8 GB in three weeks. Compaction rows (`compact`,
# `responses_compact`) always keep their body: that BLOB is the only place a
# compaction baseline and its encrypted content survive. `0` keeps none, which
# also disables `/view-system-prompt`'s assembled view (it reads the newest body).
# max_token_usage_bodies = 1

# Project instruction files injected into the system prompt (default: ["agents_md"]).
# Options: agents_md
# instruction_sources = ["agents_md"]

# Desktop notifications on macOS (default: true)
# notifications_enabled = true

# Extra skill root directories (optional). Each should contain */SKILL.md.
# Relative paths resolve against the workdir; ~ expands to $HOME.
# Loaded after built-in roots; later entries override same-named skills.
# skill_dirs = ["~/shared-skills", "./vendor/skills"]

# Inject every skill BODY into every system prompt (default: false).
# false: each turn carries only skill names + descriptions from
#        describe_available(); the full body arrives on demand via `load_skill`.
# true:  every skill body is injected into every system prompt — exact, but paid
#        for on each call; use only when a skill must be in context unconditionally.
# CLI equivalent: --skill-body-auto-inject (enable only; there is no --no- form).
# skill_body_auto_inject = false

# Subagent LLM configuration (optional).
# When configured, spawn_subagent uses a separate provider/model
# instead of the main agent's provider. References a key from
# [llm.providers.*]; model and token overrides are optional.
[agent.subagent]
# Required when any override below is set — without it the section is rejected
# at startup instead of being silently ignored.
# References [llm.providers.<name>], e.g. "deepseek" or "openai".
# provider = "deepseek"
# Optional model override (otherwise uses the provider's default model).
# model = "deepseek-chat"
# Optional token overrides (otherwise falls back to the provider entry defaults).
# max_tokens = 8000
# thinking_budget = 0
# Optional reasoning effort override (otherwise falls back to the referenced
# provider entry's value).
# openai / deepseek / kimi k3 semantics: none|minimal|low|medium|high|xhigh|max
# reasoning_effort = "high"
#
# NOTE: [agent.subagent] is deny_unknown_fields — a misspelled key here is a
# startup error, not a silent no-op.

# ---------------------------------------------------------------------------
# TUI
# ---------------------------------------------------------------------------
[ui]
# Theme name, or "auto" for terminal/system detection.
theme = "ink"     # ink | ink-light | retro | brutal | nord | dark | auto

# User-attached images (`@file.png`, `![alt](path)`).
# Requires a vision-capable model/endpoint; compress only reduces tokens.
# Text-only OpenAI-compatible APIs reject image_url (HTTP 400).
# vision_image.compress = true       # downscale + JPEG (default); false = send original
# vision_image.max_edge = 1280       # longest edge in px (256–4096)
# vision_image.jpeg_quality = 80     # JPEG quality 1–100 (when compress = true)

# ---------------------------------------------------------------------------
# Voice input (macOS-first; independent of LLM providers)
# ---------------------------------------------------------------------------
[voice]
# Show the title-bar voice button and enable microphone capture (default: false).
enabled = false
# Transcription provider: "openai" (default), "google" (Google Cloud synchronous STT),
# or "whisper_cpp" for a local whisper.cpp server.
# provider = "openai"
# API key for the transcription service — not shared with [llm.providers.*].
# Required for openai/google; ignored for whisper_cpp.
api_key = ""
# Transcription endpoint base URL.
# openai default: https://api.openai.com/v1
# google default: https://speech.googleapis.com/v1
# whisper_cpp default: http://127.0.0.1:8080
# base_url = "https://api.openai.com/v1"
# Transcription model (default: gpt-4o-mini-transcribe; google: latest_short; ignored for whisper_cpp).
# model = "gpt-4o-mini-transcribe"
# BCP-47 language hint sent to the API (default: zh; Google examples: zh-CN, en-US).
# language = "zh"
# Maximum recording duration in seconds: 1–600, or 1–60 for google (default: 300; google: 60).
# max_duration_secs = 300
# Keyboard shortcut to start/stop voice recording (optional; mouse-only when unset).
# Format: "ctrl+<char>" — one letter, digit, or symbol after ctrl+.
# Only an exact match toggles voice; other keys still reach the input box.
# Examples: "ctrl+g", "ctrl+r", "ctrl+,"
# voice_keybind = "ctrl+g"

# Google Cloud Speech-to-Text example:
# enabled = true
# provider = "google"
# api_key = "your-google-cloud-api-key"
# base_url = "https://speech.googleapis.com/v1"
# model = "latest_short"
# language = "zh-CN"          # Or "en-US", depending on the audio language.
# max_duration_secs = 60       # Google synchronous recognition allows 1–60 seconds.

# ---------------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------------
[tools]
# Bash wall-clock timeout in seconds (default: 1800; 0 disables timeout)
# bash_timeout_secs = 1800
# Nice (scheduling priority) for bash sub-process group, 0-19 (default: 10).
# Higher values mean lower priority, keeping TUI responsive during cargo test etc.
# Set to 0 to disable (bash child processes run at normal priority).
# bash_nice = 10
# Pipe bash outputs through https://github.com/rtk-ai/rtk to reduce token usage
# (default: false). Opt-in only: enabling this sends command output to an
# external process — review rtk's privacy guarantees first.
# rtk_filter = true
# OS-level sandbox for the `bash` tool (default: false). Opt-in, on/off only:
# *which* mechanism implements it is a platform decision, not a config value.
# On Linux it runs each command under bubblewrap with the workspace mounted at
# /workspace and the host home directory unmounted — so third-party code an
# approved command pulls in (cargo build scripts, npm lifecycle scripts, test
# binaries) cannot write outside the workspace, and cannot read the host home
# beyond the read-only toolchain allowlist. The host network is shared (a proxy
# on the host's loopback included), but those toolchain homes are read-only, so
# `cargo fetch` / `npm install` still fail while `curl` works.
# Install `bubblewrap` first. Platforms with no implementation yet (anything but
# Linux) accept the switch but cannot honour it, so enabling it there has no
# effect; Tact always warns and runs unsandboxed instead of failing the tool.
# sandbox = true

[mcp]
# `client_name` sent when Tact registers itself with an OAuth MCP provider
# (RFC 7591 dynamic client registration). Default: "Codex".
#
# Some providers gate registration on this exact string instead of verifying the
# client. Figma's remote server is the measured example: an identical request
# returns 200 for "Codex" and 403 for "Tact", so the default is what makes OAuth
# work there. The trade-off is that the provider — and the consent screen shown
# to you — sees "Codex" rather than "Tact".
#
# Set to "Tact" to identify honestly; allowlisting providers will then refuse
# registration (Tact will say so and offer alternatives).
# Per-server override: `auth.clientName` in mcp.json, e.g.
#   { "mcpServers": { "figma": { "url": "...", "auth": { "type": "oauth", "clientName": "Codex" } } } }
# oauth_client_name = "Codex"
