# tact configuration (TOML)
#
# Copy to one of these locations (auto-discovered):
#   ./.tact/config.toml      project-level
#   ./config.toml            project-level (alternative)
#   ~/.tact/config.toml      user-global
#
# Or pass an explicit path:
#   tact-ui --config /path/to/config.toml
#
# Interactive TUI (default):
#   tact-ui
#
# Headless single-shot task:
#   tact-ui headless "fix all clippy warnings"
#   tact-ui headless "refactor error handling in lib.rs"
#
# Priority: CLI flags override values in this file.

# ---------------------------------------------------------------------------
# LLM (required for tact-ui unless overridden via CLI)
# ---------------------------------------------------------------------------
# Active provider selects which [llm.providers.*] entry is used.
# Credentials live under providers — not as flat fields on [llm].
# Switch with llm.provider or --provider (anthropic | openai | deepseek | kimi).
[llm]
provider = "anthropic"

# Optional globals (overridable per provider entry, then by CLI flags)
# max_tokens = 8000
# thinking_budget = 0  # off by default; set to e.g. 8000 to enable

[llm.providers.anthropic]
api_key = "sk-ant-..."
model = "claude-sonnet-4-20250514"
# Anthropic has no default base_url — required
base_url = "https://api.anthropic.com"

[llm.providers.openai]
api_key = "sk-..."
model = "gpt-4o"
protocol = "responses"
# reasoning_effort = "high" # none|minimal|low|medium|high|xhigh|max
# base_url defaults to https://api.openai.com/v1
# Omit protocol or set "chat_completions" for OpenAI-compatible proxies.
# Omit reasoning_effort to keep the thinking_budget low/medium/high mapping.

# Optional OpenAI Responses `context_management.compact_threshold` (tokens).
# Sent on every ordinary `/responses` request so the endpoint compacts the
# protocol baseline automatically at the threshold. When omitted, the
# threshold is derived from agent.model_context_window / llm.max_tokens with
# 10% headroom (only for protocol = "responses").
# responses_compact_threshold = 160000
# Endpoints lacking native Responses compaction are unsupported; Tact never
# falls back to local summary compaction for protocol = "responses".

[llm.providers.deepseek]
api_key = "sk-..."
model = "deepseek-chat"
# base_url defaults to https://api.deepseek.com
# Optional protocol: omit or set "chat_completions" (default) for the DeepSeek
# Chat Completions API; "responses" talks to {base_url}/responses with the same
# Responses semantics as the openai provider (automatic context_management
# compaction, reasoning effort). Explicit /responses/compact is not implemented
# by DeepSeek, so explicit compaction falls back to the local summary pipeline.

[llm.providers.kimi]
api_key = "sk-..."
model = "kimi-k2.5"
models = ["kimi-k2.5", "kimi-for-coding"]
# base_url defaults to https://api.moonshot.cn/v1
# max_tokens = 32000           # optional per-provider override
# thinking_budget = 64000

# Heuristics still allow provider = "openai" + a Moonshot/Kimi-compatible
# base_url; prefer a dedicated [llm.providers.kimi] entry.

# ---------------------------------------------------------------------------
# Permission
# ---------------------------------------------------------------------------
[permission]
# Controls the permission mode only: "default" | "plan" | "auto"
#
# Dynamic allow/ask/deny rules are NOT stored in this file.
# They live in JSON settings files at:
#   $HOME/.tact/settings.json       (global scope)
#   <workdir>/.tact/settings.json   (project scope)
#
# JSON shape (example):
#   {
#     "permissions": {
#       "allow": [
#         "bash(command:cargo test *)",
#         "edit_file(path:src/**)"
#       ],
#       "ask": [
#         "bash(command:git push *)"
#       ],
#       "deny": [
#         "bash(command:rm -rf *)"
#       ]
#     }
#   }
#
# Rules: bare tool names (e.g. "read_file") match any input;
# argument rules (e.g. "bash(command:…)") match a specific JSON
# field using glob patterns. Precedence: deny > ask > allow.
#
# Selecting "Always allow this tool" writes a parameter-aware
# rule to the project settings file — not to config.toml.
mode = "default"

# ---------------------------------------------------------------------------
# Agent runtime
# ---------------------------------------------------------------------------
[agent]
# Model context window in tokens (must exceed max_tokens when nonzero;
# auto-compaction + TUI usage meter; default: 200000)
# model_context_window = 200000

# Max entries in the system-prompt project structure snapshot (default: 80)
# snapshot_max_items = 80

# Truncate old tool results in context (default: true)
# micro_compact_enabled = true

# Project instruction files injected into the system prompt (default: ["agents_md"]).
# Options: agents_md, claude_md (all CLAUDE paths), claude_md_user,
#          claude_md_project, claude_md_subdir
# instruction_sources = ["agents_md"]
# instruction_sources = ["agents_md", "claude_md"]

# Desktop notifications on macOS (default: true)
# notifications_enabled = true

# Extra skill root directories (optional). Each should contain */SKILL.md.
# Relative paths resolve against the workdir; ~ expands to $HOME.
# Loaded after built-in roots; later entries override same-named skills.
# skill_dirs = ["~/shared-skills", "./vendor/skills"]

# Subagent LLM configuration (optional).
# When configured, spawn_subagent uses a separate provider/model
# instead of the main agent's provider. References a key from
# [llm.providers.*]; model and token overrides are optional.
[agent.subagent]
# Required: references [llm.providers.<name>], e.g. "deepseek" or "openai".
# provider = "deepseek"
# Optional model override (otherwise uses the provider's default model).
# model = "deepseek-chat"
# Optional token overrides (otherwise falls back to the provider entry defaults).
# max_tokens = 8000
# thinking_budget = 0

# ---------------------------------------------------------------------------
# TUI
# ---------------------------------------------------------------------------
[ui]
# Theme name, or "auto" for terminal/system detection.
theme = "ink"     # ink | ink-light | retro | brutal | nord | dark | auto

# User-attached images (`@file.png`, `![alt](path)`).
# Requires a vision-capable model/endpoint; compress only reduces tokens.
# Text-only OpenAI-compatible APIs reject image_url (HTTP 400).
# vision_image.compress = true       # downscale + JPEG (default); false = send original
# vision_image.max_edge = 1280       # longest edge in px (256–4096)
# vision_image.jpeg_quality = 80     # JPEG quality 1–100 (when compress = true)

# ---------------------------------------------------------------------------
# Voice input (macOS-first; independent of LLM providers)
# ---------------------------------------------------------------------------
[voice]
# Show the title-bar voice button and enable microphone capture (default: false).
enabled = false
# Transcription provider: "openai" (default), "google" (Google Cloud synchronous STT),
# or "whisper_cpp" for a local whisper.cpp server.
# provider = "openai"
# API key for the transcription service — not shared with [llm.providers.*].
# Required for openai/google; ignored for whisper_cpp.
api_key = ""
# Transcription endpoint base URL.
# openai default: https://api.openai.com/v1
# google default: https://speech.googleapis.com/v1
# whisper_cpp default: http://127.0.0.1:8080
# base_url = "https://api.openai.com/v1"
# Transcription model (default: gpt-4o-mini-transcribe; google: latest_short; ignored for whisper_cpp).
# model = "gpt-4o-mini-transcribe"
# BCP-47 language hint sent to the API (default: zh; Google examples: zh-CN, en-US).
# language = "zh"
# Maximum recording duration in seconds: 1–600, or 1–60 for google (default: 300; google: 60).
# max_duration_secs = 300
# Keyboard shortcut to start/stop voice recording (optional; mouse-only when unset).
# Format: "ctrl+<char>" — one letter, digit, or symbol after ctrl+.
# Only an exact match toggles voice; other keys still reach the input box.
# Examples: "ctrl+g", "ctrl+r", "ctrl+,"
# voice_keybind = "ctrl+g"

# ---------------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------------
[tools]
# Bash wall-clock timeout in seconds (default: 1800; 0 disables timeout)
# bash_timeout_secs = 1800
# Nice (scheduling priority) for bash sub-process group, 0-19 (default: 10).
# Higher values mean lower priority, keeping TUI responsive during cargo test etc.
# Set to 0 to disable (bash child processes run at normal priority).
# bash_nice = 10
